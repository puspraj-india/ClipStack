<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f2">
    <title>ClipStack — Clipboard history</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20241f;
        background: #f5f5f2;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      main {
        width: min(100% - 32px, 720px);
        margin: 0 auto;
        padding: 64px 0;
      }

      header {
        margin-bottom: 32px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #547451;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(2rem, 7vw, 3rem);
        letter-spacing: -0.06em;
      }

      header p:last-child {
        margin-bottom: 0;
        color: #666d64;
      }

      .capture,
      .clip {
        border: 1px solid #e1e4dd;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 4px 16px rgb(25 35 21 / 4%);
      }

      .capture {
        padding: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.875rem;
        font-weight: 650;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 120px;
        resize: vertical;
        padding: 12px;
        border: 1px solid #d9ded5;
        border-radius: 8px;
        color: inherit;
        font: inherit;
        line-height: 1.5;
      }

      textarea:focus-visible,
      button:focus-visible {
        outline: 3px solid #9cc394;
        outline-offset: 2px;
      }

      .capture-actions,
      .history-heading,
      .clip-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .capture-actions {
        margin-top: 12px;
      }

      button {
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid #d9ded5;
        border-radius: 8px;
        background: #fff;
        color: #30372e;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #f1f4ef;
      }

      button.primary {
        border-color: #315c32;
        background: #315c32;
        color: #fff;
      }

      button.primary:hover {
        background: #244a26;
      }

      .status {
        min-height: 1.5em;
        margin: 10px 0 0;
        color: #547451;
        font-size: 0.875rem;
      }

      .history-heading {
        margin: 36px 0 14px;
      }

      .history-heading h2 {
        margin: 0;
        font-size: 1.125rem;
      }

      .history-heading span {
        color: #737a70;
        font-size: 0.875rem;
      }

      #clear-history {
        min-height: 34px;
        padding: 0 10px;
        color: #737a70;
        font-size: 0.8rem;
      }

      #history {
        display: grid;
        gap: 12px;
      }

      .clip {
        padding: 16px;
      }

      .clip-content {
        max-height: 180px;
        overflow: auto;
        margin: 0 0 14px;
        color: #373d35;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.875rem;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .clip-actions time {
        margin-right: auto;
        color: #858b82;
        font-size: 0.75rem;
      }

      .clip-actions button {
        min-height: 34px;
        padding: 0 10px;
        font-size: 0.8rem;
      }

      .empty {
        padding: 28px 20px;
        border: 1px dashed #cfd5ca;
        border-radius: 12px;
        color: #737a70;
        text-align: center;
      }

      @media (max-width: 520px) {
        main {
          padding: 40px 0;
        }

        .capture {
          padding: 16px;
        }

        .capture-actions {
          align-items: stretch;
          flex-direction: column-reverse;
        }

        .capture-actions button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Your personal clipboard</p>
        <h1>ClipStack</h1>
        <p>Save snippets as you go. Your history stays in this browser.</p>
      </header>

      <form class="capture" id="capture-form">
        <label for="clip-input">Add a clipboard item</label>
        <textarea id="clip-input" placeholder="Paste or type something to save…" required></textarea>
        <div class="capture-actions">
          <button type="button" id="paste-button">Paste from clipboard</button>
          <button class="primary" type="submit">Save to history</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <section aria-labelledby="history-title">
        <div class="history-heading">
          <h2 id="history-title">Recent clips <span id="clip-count">0</span></h2>
          <button type="button" id="clear-history" hidden>Clear all</button>
        </div>
        <div id="history"></div>
      </section>
    </main>

    <script>
      const storageKey = "clipstack.history";
      const maxClips = 50;
      const form = document.querySelector("#capture-form");
      const input = document.querySelector("#clip-input");
      const status = document.querySelector("#status");
      const historyElement = document.querySelector("#history");
      const countElement = document.querySelector("#clip-count");
      const clearButton = document.querySelector("#clear-history");
      let clips = loadClips();

      function loadClips() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
          return Array.isArray(saved)
            ? saved.filter((clip) =>
                clip &&
                typeof clip.id === "string" &&
                typeof clip.text === "string" &&
                Number.isFinite(clip.createdAt) &&
                Math.abs(clip.createdAt) <= 8.64e15
              ).slice(0, maxClips)
            : [];
        } catch {
          return [];
        }
      }

      function saveClips() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(clips));
          return true;
        } catch {
          return false;
        }
      }

      function setStatus(message) {
        status.textContent = message;
      }

      function renderClips() {
        historyElement.replaceChildren();
        countElement.textContent = `(${clips.length})`;
        clearButton.hidden = clips.length === 0;

        if (clips.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "Your saved clips will appear here.";
          historyElement.append(empty);
          return;
        }

        for (const clip of clips) {
          const card = document.createElement("article");
          card.className = "clip";

          const content = document.createElement("p");
          content.className = "clip-content";
          content.textContent = clip.text;

          const actions = document.createElement("div");
          actions.className = "clip-actions";

          const time = document.createElement("time");
          time.dateTime = new Date(clip.createdAt).toISOString();
          time.textContent = new Date(clip.createdAt).toLocaleString();

          const copyButton = document.createElement("button");
          copyButton.type = "button";
          copyButton.dataset.action = "copy";
          copyButton.dataset.id = clip.id;
          copyButton.textContent = "Copy";

          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.dataset.action = "delete";
          deleteButton.dataset.id = clip.id;
          deleteButton.textContent = "Delete";
          deleteButton.setAttribute("aria-label", "Delete saved clip");

          actions.append(time, copyButton, deleteButton);
          card.append(content, actions);
          historyElement.append(card);
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value;
        if (!text.trim()) {
          setStatus("Add some text before saving.");
          return;
        }

        clips.unshift({
          id: globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`,
          text,
          createdAt: Date.now(),
        });
        clips = clips.slice(0, maxClips);
        const stored = saveClips();
        renderClips();
        input.value = "";
        setStatus(stored ? "Saved to your clipboard history." : "Saved for now, but browser storage is unavailable.");
      });

      document.querySelector("#paste-button").addEventListener("click", async () => {
        if (!navigator.clipboard?.readText) {
          setStatus("Clipboard access is unavailable. Paste into the text box instead.");
          input.focus();
          return;
        }

        try {
          input.value = await navigator.clipboard.readText();
          input.focus();
          setStatus(input.value ? "Clipboard text ready to save." : "The clipboard is empty.");
        } catch {
          setStatus("Clipboard access was blocked. Paste into the text box instead.");
          input.focus();
        }
      });

      historyElement.addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;

        if (button.dataset.action === "copy") {
          const clip = clips.find((item) => item.id === button.dataset.id);
          if (!clip) return;
          try {
            await navigator.clipboard.writeText(clip.text);
            setStatus("Copied to clipboard.");
          } catch {
            setStatus("Could not access the clipboard. Check browser permissions.");
          }
        } else if (button.dataset.action === "delete") {
          clips = clips.filter((item) => item.id !== button.dataset.id);
          const stored = saveClips();
          renderClips();
          setStatus(stored ? "Clip deleted." : "Clip deleted for now, but browser storage is unavailable.");
        }
      });

      clearButton.addEventListener("click", () => {
        clips = [];
        const stored = saveClips();
        renderClips();
        setStatus(stored ? "Clipboard history cleared." : "History cleared for now, but browser storage is unavailable.");
      });

      renderClips();
    </script>
  </body>
</html>
